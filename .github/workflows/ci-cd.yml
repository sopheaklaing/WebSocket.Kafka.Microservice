
name: WebSocket Kafka Microservice CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websocket-kafka-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sopheaklaing/websocket-kafka-microservice

jobs:
  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            database: order_db
          - service: inventory-service
            database: inventory_db
          - service: notification-service
            database: order_db
          - service: alert-service
            database: order_db

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: order_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d order_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            order-service/pom.xml
            inventory-service/pom.xml
            notification-service/pom.xml
            alert-service/pom.xml

      - name: Create inventory database
        if: matrix.database == 'inventory_db'
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -U postgres -d postgres \
            -c "CREATE DATABASE inventory_db;"

      - name: Run Maven tests
        working-directory: ${{ matrix.service }}
        env:
          SERVER_PORT: "8081"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          chmod +x mvnw
          ./mvnw -B test

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build services for analysis
        run: |
          set -e
          for service in order-service inventory-service notification-service alert-service; do
            chmod +x "$service/mvnw"
            (cd "$service" && ./mvnw -B -DskipTests package)
          done

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  checkov:
    name: Infrastructure and workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions,yaml
          soft_fail: false
          output_format: cli

  trivy-filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  publish:
    name: Build, scan and publish images
    needs:
      - test
      - gitleaks
      - sonarqube
      - checkov
      - trivy-filesystem
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # ORDER SERVICE
      # --------------------------------------------------
      - name: Build order-service image
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-order-service:${{ steps.vars.outputs.tag }}

      - name: Diagnose order-service image
        shell: bash
        run: |
          set -eu

          IMAGE="${IMAGE_PREFIX}-order-service:${{ steps.vars.outputs.tag }}"

          echo "=== Image metadata ==="
          docker image inspect "$IMAGE" \
            --format 'OS={{.Os}} Architecture={{.Architecture}} Labels={{json .Config.Labels}}'

          echo "=== OS release ==="
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'cat /etc/os-release'

          echo "=== Pebble binary ==="
          docker run --rm --entrypoint sh "$IMAGE" -c '
            ls -l /usr/bin/pebble 2>/dev/null || true
            command -v pebble || true
            dpkg -S /usr/bin/pebble 2>/dev/null || true
            if command -v go >/dev/null 2>&1; then
              go version -m /usr/bin/pebble 2>/dev/null || true
            fi
          '

      - name: Trivy order-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}-order-service:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # --------------------------------------------------
      # INVENTORY SERVICE
      # --------------------------------------------------
      - name: Build inventory-service image
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-service
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-inventory-service:${{ steps.vars.outputs.tag }}

      - name: Trivy inventory-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}-inventory-service:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # --------------------------------------------------
      # NOTIFICATION SERVICE
      # --------------------------------------------------
      - name: Build notification-service image
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-notification-service:${{ steps.vars.outputs.tag }}

      - name: Trivy notification-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}-notification-service:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # --------------------------------------------------
      # ALERT SERVICE
      # --------------------------------------------------
      - name: Build alert-service image
        uses: docker/build-push-action@v6
        with:
          context: ./alert-service
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-alert-service:${{ steps.vars.outputs.tag }}

      - name: Trivy alert-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}-alert-service:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # --------------------------------------------------
      # PUBLISH TO GHCR
      # --------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish all service images
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail

          for service in order-service inventory-service notification-service alert-service; do
            image="${IMAGE_PREFIX}-${service}"

            docker push "${image}:${IMAGE_TAG}"

            docker tag "${image}:${IMAGE_TAG}" "${image}:latest"
            docker push "${image}:latest"
          done

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_USER,GHCR_READ_TOKEN,IMAGE_TAG,VPS_APP_DIR
          script_stop: true
          script: |
            set -eu

            cd "$VPS_APP_DIR"

            echo "$GHCR_READ_TOKEN" | sudo docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            sudo env IMAGE_TAG="$IMAGE_TAG" \
              docker compose -f docker-compose.prod.yml pull

            sudo env IMAGE_TAG="$IMAGE_TAG" \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

            sudo docker image prune -f
