
name: WebSocket Kafka Microservices DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microservices-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  IMAGE_PREFIX: ghcr.io/sopheaklaing/websocket-kafka-microservice

jobs:
  # 1. Build and test all four services
  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - notification-service
          - alert-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Run Maven tests
        run: mvn -B -f "${{ matrix.service }}/pom.xml" test

  # 2. Scan Git history for accidentally committed secrets
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Scan Maven dependencies against the NVD database
  dependency-check:
    name: OWASP Dependency-Check - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - notification-service
          - alert-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Analyze dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Configure the NVD_API_KEY repository secret."
            exit 1
          fi

          mvn -B -f "${{ matrix.service }}/pom.xml" \
            org.owasp:dependency-check-maven:13.0.0:check \
            -DnvdApiKey="$NVD_API_KEY" \
            -DfailBuildOnCVSS=7

  # 4. Analyze all Java services in one SonarQube project
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile all services
        run: |
          for service in order-service inventory-service notification-service alert-service; do
            mvn -B -f "$service/pom.xml" -DskipTests package
          done

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=websocket-kafka-microservice
            -Dsonar.projectName=WebSocket Kafka Microservice
            -Dsonar.sources=order-service/src/main/java,inventory-service/src/main/java,notification-service/src/main/java,alert-service/src/main/java
            -Dsonar.tests=order-service/src/test/java,inventory-service/src/test/java,notification-service/src/test/java,alert-service/src/test/java
            -Dsonar.java.binaries=order-service/target/classes,inventory-service/target/classes,notification-service/target/classes,alert-service/target/classes
            -Dsonar.java.test.binaries=order-service/target/test-classes,inventory-service/target/test-classes,notification-service/target/test-classes,alert-service/target/test-classes

  # 5. Scan Dockerfiles, GitHub Actions and YAML configurations
  checkov:
    name: Checkov Infrastructure Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions,yaml
          output_format: cli
          soft_fail: false

  # 6. Scan repository files for known vulnerabilities
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 7. Build and publish each service image to GHCR
  publish:
    name: Build and Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - test
      - gitleaks
      - dependency-check
      - sonarqube
      - checkov
      - trivy-filesystem

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - notification-service
          - alert-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 8. Deploy only after all checks and image scans pass
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,VPS_APP_DIR
          script: |
            set -eu

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            cd "$VPS_APP_DIR"

            test -f docker-compose.prod.yml
            test -f .env

            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose \
              --env-file .env \
              -f docker-compose.prod.yml pull

            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose \
              --env-file .env \
              -f docker-compose.prod.yml up -d --remove-orphans

            sudo docker compose \
              --env-file .env \
              -f docker-compose.prod.yml ps