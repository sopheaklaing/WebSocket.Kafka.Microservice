
name: WebSocket Kafka Microservice CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websocket-kafka-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sopheaklaing/websocket-kafka-microservice

jobs:
  # --------------------------------------------------
  # 1. TEST ALL SERVICES
  # --------------------------------------------------
  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            database: order_db
          - service: inventory-service
            database: inventory_db
          - service: notification-service
            database: order_db
          - service: alert-service
            database: order_db

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: order_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d order_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_NUM_PARTITIONS: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            order-service/pom.xml
            inventory-service/pom.xml
            notification-service/pom.xml
            alert-service/pom.xml

      - name: Create inventory database
        if: matrix.database == 'inventory_db'
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -U postgres -d postgres \
            -c "CREATE DATABASE inventory_db;"

      - name: Run Maven tests
        working-directory: ${{ matrix.service }}
        env:
          SERVER_PORT: "8081"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          chmod +x mvnw
          ./mvnw -B test

  # --------------------------------------------------
  # 2. SECRET SCANNING
  # --------------------------------------------------
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------
  # 3. SONARQUBE
  # --------------------------------------------------
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build services for analysis
        run: |
          set -euo pipefail

          for service in order-service inventory-service notification-service alert-service; do
            chmod +x "$service/mvnw"
            (
              cd "$service"
              ./mvnw -B -DskipTests package
            )
          done

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # --------------------------------------------------
  # 4. CHECKOV
  # --------------------------------------------------
  checkov:
    name: Infrastructure and workflow security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions,yaml
          soft_fail: false
          output_format: cli

  # --------------------------------------------------
  # 5. TRIVY FILESYSTEM SCAN
  # --------------------------------------------------
  trivy-filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # --------------------------------------------------
  # 6. BUILD AND SCAN IMAGES
  # --------------------------------------------------
  build-and-scan:
    name: Build and scan - ${{ matrix.service }}
    needs:
      - test
      - gitleaks
      - sonarqube
      - checkov
      - trivy-filesystem

    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - notification-service
          - alert-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # --------------------------------------------------
  # 7. PUBLISH DIRECTLY TO GHCR
  # --------------------------------------------------
  publish:
    name: Publish - ${{ matrix.service }}
    needs: build-and-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - notification-service
          - alert-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # --------------------------------------------------
  # 8. DEPLOY TO VPS
  # --------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate VPS configuration
        shell: bash
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -eu

          for name in VPS_USER VPS_HOST VPS_SSH_KEY VPS_APP_DIR GHCR_USER GHCR_READ_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is empty or unavailable"
              exit 1
            fi
          done

          echo "Required deployment secrets are configured."

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_USER,GHCR_READ_TOKEN,IMAGE_TAG,VPS_APP_DIR
          script_stop: true
          command_timeout: 10m

          script: |
            set -eu

            cd "$VPS_APP_DIR"

            echo "Deploying image tag: $IMAGE_TAG"

            DEPLOY_ENV_FILE="$(mktemp)"
            trap 'rm -f "$DEPLOY_ENV_FILE"' EXIT

            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > "$DEPLOY_ENV_FILE"
            chmod 600 "$DEPLOY_ENV_FILE"

            echo "$GHCR_READ_TOKEN" | sudo -n /usr/bin/docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            sudo -n /usr/bin/docker compose \
              --env-file .env \
              --env-file "$DEPLOY_ENV_FILE" \
              -f docker-compose.prod.yml pull

            sudo -n /usr/bin/docker compose \
              --env-file .env \
              --env-file "$DEPLOY_ENV_FILE" \
              -f docker-compose.prod.yml up -d --remove-orphans

            sudo -n /usr/bin/docker compose \
              --env-file .env \
              --env-file "$DEPLOY_ENV_FILE" \
              -f docker-compose.prod.yml ps

            sudo -n /usr/bin/docker image prune -f
