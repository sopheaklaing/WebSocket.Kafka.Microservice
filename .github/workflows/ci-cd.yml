
name: WebSocket Kafka Microservices DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Java Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - notification-service
          - alert-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B test

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - notification-service
          - alert-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Scan Maven dependencies
        working-directory: ${{ matrix.service }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          ./mvnw -B \
            org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=7.0 \
            -Dformats=HTML,JSON \
            -DnvdApiKey="$NVD_API_KEY"

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ matrix.service }}
          path: ${{ matrix.service }}/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 14

  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            project_key: websocket-kafka-order-service
          - service: inventory-service
            project_key: websocket-kafka-inventory-service
          - service: notification-service
            project_key: websocket-kafka-notification-service
          - service: alert-service
            project_key: websocket-kafka-alert-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Analyze and enforce Quality Gate
        working-directory: ${{ matrix.service }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ matrix.project_key }} \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600

  checkov:
    name: Checkov Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Dockerfiles, Compose and GitHub Actions
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,docker_compose,github_actions
          soft_fail: false

  trivy_filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan filesystem, dependencies, secrets and misconfigurations
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Scan and Publish Container Image
    runs-on: ubuntu-latest
    needs:
      - test
      - gitleaks
      - dependency_check
      - sonarqube
      - checkov
      - trivy_filesystem

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            image: websocket-kafka-microservice-order-service
          - service: inventory-service
            image: websocket-kafka-microservice-inventory-service
          - service: notification-service
            image: websocket-kafka-microservice-notification-service
          - service: alert-service
            image: websocket-kafka-microservice-alert-service

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_SHA: sha-${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"

          docker tag "local/${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker tag "local/${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE}:${IMAGE_SHA}"

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${IMAGE_SHA}"
